<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>IAM Abadia — acesso restrito</title>
<style>
  :root { --verde:#1A895A; --amarelo:#F6D03A; --azul:#0076AE; --vermelho:#B4262A; --tinta:#1f2430; --noite:#0b1430; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: radial-gradient(ellipse at 30% 20%, #16254d, var(--noite) 70%); color: var(--tinta); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .faixa { position: fixed; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, var(--verde) 0 20%, #fff 20% 40%, var(--vermelho) 40% 60%, var(--amarelo) 60% 80%, var(--azul) 80%); }
  .caixa { background: #fff; border-radius: 20px; padding: 32px 28px; width: 100%; max-width: 400px; box-shadow: 0 16px 48px rgba(0,0,0,.5); text-align: center; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  p { font-size: 15px; color: #5a6272; margin-bottom: 20px; line-height: 1.4; }
  input { width: 100%; font-size: 18px; padding: 12px 14px; border: 2px solid #d5dae3; border-radius: 12px; outline: none; text-align: center; }
  input:focus { border-color: var(--azul); }
  label.lembrar { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 14px; color: #5a6272; margin: 14px 0 18px; }
  button { width: 100%; font-size: 18px; font-weight: 700; padding: 13px; border: none; border-radius: 12px; background: var(--amarelo); color: var(--tinta); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .erro { color: var(--vermelho); font-size: 14px; min-height: 20px; margin-top: 12px; }
</style>
</head>
<body>
<div class="faixa"></div>
<form class="caixa" id="f">
  <h1>Infância e Adolescência Missionária</h1>
  <p>Paróquia Nossa Senhora da Abadia<br>Acesso restrito. Digite o código.</p>
  <input id="c" type="password" autocomplete="current-password" placeholder="código de acesso" autofocus>
  <label class="lembrar"><input id="l" type="checkbox" checked style="width:auto"> Lembrar neste aparelho</label>
  <button id="b" type="submit">Entrar</button>
  <div class="erro" id="e"></div>
</form>
<script>
const ITER = 250000;
const CHAVE_LOCAL = 'iamabadia-codigo';
async function abrir(codigo, lembrar) {
  const b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; b.textContent = 'Abrindo…'; e.textContent = '';
  try {
    const r = await fetch('conteudo.bin', { cache: 'no-cache' });
    const buf = new Uint8Array(await r.arrayBuffer());
    const sal = buf.slice(0, 16), iv = buf.slice(16, 28), dados = buf.slice(28);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(codigo), 'PBKDF2', false, ['deriveKey']);
    const chave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sal, iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const claro = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, chave, dados);
    try { if (lembrar) localStorage.setItem(CHAVE_LOCAL, codigo); } catch (_) {}
    const html = new TextDecoder().decode(claro);
    document.open(); document.write(html); document.close();
  } catch (err) {
    try { localStorage.removeItem(CHAVE_LOCAL); } catch (_) {}
    b.disabled = false; b.textContent = 'Entrar';
    e.textContent = location.protocol === 'file:' ? 'Abra pelo endereço do site, não pelo arquivo.' : 'Código errado. Tente de novo.';
  }
}
document.getElementById('f').addEventListener('submit', ev => {
  ev.preventDefault();
  abrir(document.getElementById('c').value.trim(), document.getElementById('l').checked);
});
try { const salvo = localStorage.getItem(CHAVE_LOCAL); if (salvo) abrir(salvo, true); } catch (_) {}
</script>
</body>
</html>
